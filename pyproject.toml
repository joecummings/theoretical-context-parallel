[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theoretical-context-parallel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "seaborn>=0.13",
]

[project.optional-dependencies]
gpu = ["torch", "triton"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
